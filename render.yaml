services:
  - type: web
    name: Cinderella-cakes-website
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn run:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: FLASK_ENV
        value: "production"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: "https://cinderella-cakes-website.onrender.com,https://cinderellacakesug.com,https://www.cinderellacakesug.com"
      - key: SERVER_BASE_URL
        value: "https://cinderella-cakes-website.onrender.com"
